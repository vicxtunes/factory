name: Lint

# The rules in eslint.config.mjs (among them: no sign-out that ends every
# device's session) are checked on every push to the release branches.
on:
  push:
    branches: [main, dev, payments]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
