# Both apps, one image each (see Dockerfile's APP build arg). They share the
# database and the same .env.
x-build-args: &build-args
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  NEXT_PUBLIC_CLIENT_ORIGIN: ${NEXT_PUBLIC_CLIENT_ORIGIN}

services:
  factory:
    build:
      context: .
      args:
        <<: *build-args
        APP: factory
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build:
      context: .
      args:
        <<: *build-args
        APP: client
    env_file: .env
    ports:
      - "3001:3000"
    restart: unless-stopped
